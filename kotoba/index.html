<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f2e9"><meta name="description" content="每天35个日语新词，7天课程、每日5字手帖与70个备用词。词卡、汉字小注、主动回想和掌握后自动补位。">

<body>
  <header class="topbar"><a href="#" class="brand" aria-label="日々ことば首页"><span class="seal" lang="ja">言</span><span><b lang="ja">日々ことば</b><small>日语词汇手帖</small></span></a><span class="edition">第一周 <i>01 — 07</i></span><a class="pdf-link" href="kotoba-sample.pdf" target="_blank" rel="noopener">第 1 天 PDF <span aria-hidden="true">↗</span></a></header>
  <main class="shell">
    <section class="intro"><div><p class="eyebrow">A LITTLE JAPANESE, EVERY DAY</p><h1>今天，记住一点日语。</h1><p class="intro-copy">每天 35 个新词，5 个汉字。会的跳过，新的补上。</p></div><div class="daily-meter"><div class="meter-top"><span>本课已自评</span><b id="progressText">0 <span>/ 35</span></b></div><div class="meter-track"><span id="progressFill"></span></div><p><span id="knownCount">0</span> 词已记住 <span class="dot">·</span> <span id="dayQuantity">目标 35 词</span></p></div></section>
    <section class="course-bar"><nav id="courseDays" aria-label="选择课程"></nav><div class="course-tools"><p id="reserveNote"></p><button class="text-button" data-action="print">打印本课 / 存为 PDF ↗</button></div></section>
    <p id="shortfall" class="notice" hidden></p>
    <nav class="tabs" aria-label="学习区域"><button data-tab="study" class="active" aria-current="page">01 <span>词卡学习</span></button><button data-tab="list">02 <span>词汇一览</span></button><button data-tab="kanji">03 <span>汉字手帖</span></button><button data-tab="review">04 <span>回想练习</span><em id="reviewCount">0</em></button><button data-tab="stats">05 <span>学习记录</span></button></nav>
    <div id="workspace" aria-live="off"><p class="loading">正在打开学习手帖…</p></div>
    <section class="method"><span class="mini-seal" lang="ja">習</span><p><b>看见 → 理解 → 回想</b><br>进度只保存在当前浏览器，换设备前可导出备份。</p><button id="aboutBtn" class="text-button">说明与来源 ↗</button></section>
    <div class="progress-tools"><button class="text-button" data-action="export">导出进度</button><button class="text-button" data-action="import">导入进度</button><input id="importInput" type="file" accept="application/json,.json" hidden><span>学习时间 · 北京时间 12:40</span></div>
  </main>
  <footer class="footer"><span lang="ja">自分のペースで。</span><span>按自己的节奏来。</span><span class="storage-note" id="storageNote">进度保存在当前浏览器</span></footer>
